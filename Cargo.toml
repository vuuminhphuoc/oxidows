[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
repository = "https://github.com/vuuminhphuoc/oxidows"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
taskmgr-core = { path = "crates/taskmgr-core" }
taskmgr-sys = { path = "crates/taskmgr-sys" }
explorer-core = { path = "crates/explorer-core" }
explorer-sys = { path = "crates/explorer-sys" }
ui-common = { path = "crates/ui-common" }
oxi-share = { path = "crates/oxi-share" }
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
windows-sys = "0.61"
winresource = { version = "0.1", default-features = false }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
