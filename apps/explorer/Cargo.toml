[package]
name = "oxi-explorer"
description = "A fast File Explorer written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
explorer-core = { workspace = true }
explorer-sys = { workspace = true }
egui = { workspace = true }
ui-common = { workspace = true }
oxi-share = { workspace = true }
qrcode = { version = "0.14", default-features = false }
egui_extras = { workspace = true }
raw-window-handle = "0.6"
eframe = { workspace = true, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }

# The exe icon and version info (shown by Explorer, Task Manager and the taskbar).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
