[package]
name = "oxi-taskmgr"
description = "A fast Task Manager written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
taskmgr-core = { workspace = true }
taskmgr-sys = { workspace = true }
egui = { workspace = true }
ui-common = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
raw-window-handle = "0.6"

# The exe icon and version info (shown by Explorer, Task Manager and the taskbar).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
