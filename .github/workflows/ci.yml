name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job below asks for more.
permissions:
  contents: read

# A new push to a PR cancels its older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    # A hung test or app must not hold the runner for the 6 h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version; this installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Build the tests first so a slow compile and a slow test show up as separate steps.
      - run: cargo test --workspace --no-run
      - run: cargo test --workspace
        timeout-minutes: 15
      # Where oxidows still differs from the real Windows (see docs/testing.md); never fails.
      - name: Parity report
        run: cargo test -p explorer-sys --test oracle divergence_report -- --nocapture
      - run: cargo build --release --workspace
      # Pure-Rust pieces timed next to the Windows functions they replace; fails only on a
      # tenfold slowdown. The table lands in the job summary.
      - name: Bench vs Windows
        run: cargo bench -p explorer-sys --bench vs_windows
        timeout-minutes: 10
      # Every app exe named oxi-*.exe is launched, measured and screenshotted (see scripts/smoke.ps1).
      - name: Smoke test
        shell: pwsh
        env:
          OXI_TASKMGR_TIMING: "1"
          OXI_EXPLORER_TIMING: "1"
        run: ./scripts/smoke-all.ps1 -OutDir smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-results
          path: smoke/
          if-no-files-found: ignore
      # Real mouse input on the runner's desktop: oxi-explorer drags files out to another program
      # and takes a drop from one (see scripts/dnd-test.ps1).
      - name: Drag and drop test
        shell: pwsh
        run: ./scripts/dnd-test.ps1 -Exe target/release/oxi-explorer.exe -OutDir dnd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dnd-results
          path: dnd/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxidows-windows
          path: target/release/oxi-*.exe

  # A tag like v0.1.0 publishes the exe as a GitHub Release download.
  # Publishes v<workspace version> once: on a pushed tag, or on the first green main build of a new
  # version (bump `version` in Cargo.toml to cut a release).
  release:
    if: github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.ver.outputs.exists != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oxidows-windows
          path: dist
      - if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/oxi-*.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "oxidows $TAG"
          --notes "Windows x64 builds of the oxidows apps. Unsigned: Windows SmartScreen may warn on first run."
