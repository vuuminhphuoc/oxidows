name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    # A hung test or app must not hold the runner for the 6 h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Every app exe named oxi-*.exe is launched, measured and screenshotted (see scripts/smoke.ps1).
      - name: Smoke test
        shell: pwsh
        env:
          OXI_TASKMGR_TIMING: "1"
          OXI_EXPLORER_TIMING: "1"
        run: ./scripts/smoke-all.ps1 -OutDir smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: oxidows-windows
          path: target/release/oxi-*.exe

  # A tag like v0.1.0 publishes the exe as a GitHub Release download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oxidows-windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" oxi-*.exe
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes "Windows x64 builds of the oxidows apps. Unsigned: Windows SmartScreen may warn on first run."
