name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; this installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Every app exe named oxi-*.exe is launched, measured and screenshotted (see scripts/smoke.ps1).
      - name: Smoke test
        shell: pwsh
        env:
          OXI_TASKMGR_TIMING: "1"
        run: ./scripts/smoke-all.ps1 -OutDir smoke
      # Temporary: idle CPU per wgpu backend, to pick the cheapest one on machines without a GPU.
      - name: Idle CPU per renderer backend
        shell: pwsh
        continue-on-error: true
        env:
          OXI_TASKMGR_TIMING: "1"
        run: |
          foreach ($b in 'dx12', 'vulkan', 'gl') {
            $env:WGPU_BACKEND = $b
            try { ./scripts/smoke.ps1 -Exe target/release/oxi-taskmgr.exe -Name "taskmgr-$b" -OutDir smoke-backends }
            catch { Write-Host "taskmgr-$b failed: $_" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: oxidows-windows
          path: target/release/oxi-*.exe

  # A tag like v0.1.0 publishes the exe as a GitHub Release download.
  # Publishes v<workspace version> once: on a pushed tag, or on the first green main build of a new
  # version (bump `version` in Cargo.toml to cut a release).
  release:
    if: github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.ver.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: oxidows-windows
          path: dist
      - if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/oxi-*.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "oxidows $TAG"
          --notes "Windows x64 builds of the oxidows apps. Unsigned: Windows SmartScreen may warn on first run."
