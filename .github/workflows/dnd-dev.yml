name: dnd-dev
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-6gxza6"]
jobs:
  dnd:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release -p oxi-explorer
      - name: Drag and drop test
        shell: pwsh
        continue-on-error: true
        run: ./scripts/dnd-test.ps1 -Exe target/release/oxi-explorer.exe -OutDir dnd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dnd-results
          path: dnd/
          if-no-files-found: ignore
