[package]
name = "ui-common"
description = "UI shared by the oxidows egui apps: Windows 11 theme, fonts, icons, widgets, renderer choice"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
egui = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Already in the build through egui; the tests read the system icon font's character map with it.
skrifa = "0.44"
